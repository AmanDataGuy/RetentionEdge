[project]
name = "retentionedge"
version = "0.1.0"
description = "Causal uplift retention targeting on the Hillstrom randomized email campaign dataset"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "scikit-uplift>=0.5.1",
    "scipy>=1.12",
    "shap>=0.45",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retentionedge"]
